<!DOCTYPE html>
<html lang="ru">
<head>

    <title>Ведьмак 3: Каэр Морхен</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #000;
            color: white;
            overflow-x: hidden;
        }

        /* Фоновое видео на весь экран */
        .witcher-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* Навигация */
        header nav {
            padding: 20px;
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            text-transform: uppercase;
        }

        /* Основной контейнер с текстом */
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .content-box {
            background: rgba(0, 0, 0, 0.7);
            padding: 40px;
            border-radius: 15px;
            max-width: 700px;
            text-align: center;
            border: 1px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(5px);
            margin: 20px;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 20px;
            color: #eee;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        /* Твой стиль для имени */
        .name-highlight {
            color: #d4af37;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
        }
    </style>
</head>
