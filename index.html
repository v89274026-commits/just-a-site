<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Witcher 3 — Kaer Morhen</title>
    <style>
        /* Обнуляем отступы */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            overflow: hidden; /* Чтобы не было лишней прокрутки из-за видео */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        /* Контейнер для видео-фона */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: #000;
        }

        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Растягиваем без искажений */
        }

        /* Стили для контента */
        header {
            width: 100%;
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
            text-align: center;
            border-bottom: 1px solid #d4af37;
        }

        nav {
            color: #d4af37;
            font-size: 1.5rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: bold;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
        }

        .content-box {
            background: rgba(0, 0, 0, 0.75);
            padding: 40px;
            border-radius: 10px;
            border: 2px solid #d4af37;
            color: #fff;
            max-width: 600px;
            text-align: center;
            backdrop-filter: blur(8px); /* Красивое размытие фона за блоком */
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #f0f0f0;
        }

        .name-highlight {
            color: #d4af37;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.8);
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Фоновое видео -->
    <div class="video-background">
        <video autoplay muted loop playsinline>
            <source src="https://github.com/user-attachments/assets/03dc8681-90ad-42d2-89ce-91b73481b677" type="video/mp4">
            <!-- Если видео не грузится, можно вставить запасную ссылку на гифку ниже -->
        </video>
    </div>

    <header>
        <nav>ВЕДЬМАК 3: ДИКАЯ ОХОТА</nav>
    </header>

    <main>
        <section class="content-box">
            <h1>Добро пожаловать в Каэр Морхен</h1>
            <p>Привет! Меня зовут <span class="name-highlight">Камилла</span>.</p>
            <p>Это мой адаптивный сайт. Тут я объединила эстетику Ведьмака и всё, чему научилась на уроках.</p>
        </section>
    </main>

</body>
</html>
