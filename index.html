<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Witcher 3 - Project Camilla</title>
    <style>
        /* Базовые настройки экрана */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
        }

        /* Настройка видео-фона */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .witcher-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.6); /* Немного затемняем, чтобы текст читался */
        }

        /* Контент сайта */
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .content-box {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 2px solid #d4af37;
            border-radius: 15px;
            padding: 40px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }

        p {
            line-height: 1.6;
            font-size: 1.1rem;
        }

        .highlight {
            color: #d4af37;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Ссылка на видео с твоего скриншота image_9843a2.jpg -->
    <div class="bg-container">
        <video autoplay muted loop playsinline class="witcher-bg">
            <source src="bg-witcher3.mp4" type="video/mp4">
          
        </video>
    </div>

    <main>
        <div class="content-box">
            <h1>Проект Camilla</h1>
            <p>Привет! Меня зовут <span class="highlight">Камилла</span>.</p>
            <p>Это мой адаптивный проект с динамическим фоном. Теперь всё настроено правильно, а пути к файлам проверены до последней буквы.</p>
        </div>
    </main>

</body>
</html>
