<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Witcher 3 - Camilla's Project</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000; /* Черный фон, пока грузится гифка */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow-x: hidden;
        }

        /* Твой анимированный фон из Стима */
        .witcher-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* Контейнер с контентом */
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .content-box {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 2px solid #d4af37;
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
            /* Анимация появления из твоего урока */
            animation: fadeIn 2.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }

        p {
            line-height: 1.6;
            font-size: 1.1rem;
        }

        .highlight {
            color: #d4af37;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Используем <img> вместо CSS фона для надежности -->
    <img src="witcher_bg.gif" alt="Kaer Morhen" class="witcher-bg">

    <main>
        <section class="content-box">
            <h1>Добро пожаловать в Каэр Морхен</h1>
            <p>Привет! Меня зовут <span class="highlight">Камилла</span>.</p>
            <p>Это мой проект по IT, где я объединила эстетику Ведьмака 3 и всё, чему научилась на уроках: от семантики до CSS-анимаций.</p>
        </section>
    </main>

</body>
</html>
