<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>The Witcher 3 - My Project</title>
    <style>
        /* Стили для анимированного фона */
        body {
            margin: 0;
            padding: 0;
            /* Если у тебя GIF: */
            background: url('witcher_bg.gif') no-repeat center center fixed; 
            background-size: cover; /* Растягивает на весь экран */
            
            font-family: 'Arial', sans-serif;
            color: white;
        }

        /* Контейнер для контента, чтобы он не слипался */
        .content {
            position: relative;
            z-index: 1;
            background: rgba(0, 0, 0, 0.6); /* Полупрозрачный черный фон для читаемости текста */
            margin: 50px auto;
            padding: 30px;
            width: 80%;
            border: 2px solid #d4af37; /* Золотая рамка в стиле Ведьмака */
            border-radius: 10px;
        }

        h1 {
            color: #d4af37;
            text-align: center;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>Добро пожаловать в Каэр Морхен</h1>
        <p>Тут будет твое дз, описание прохождений Ведьмака и всё, что ты выучила в айти.</p>
    </div>

</body>
</html>
