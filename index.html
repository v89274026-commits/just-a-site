<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Witcher 3 - Camilla's Project</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: white;
            overflow: hidden;
        }

        .witcher-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            transform: translateZ(0);
            filter: brightness(0.8);
        }

        header {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #d4af37;
            position: relative;
            z-index: 1;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 60px);
            padding: 20px;
        }

        .content-box {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 2px solid #d4af37;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
            animation: fadeIn 2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #d4af37;
            text-transform: uppercase;
            font-size: 1.8rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .name-highlight {
            color: #d4af37;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.4rem; }
            .content-box { padding: 20px; }
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="witcher-bg">
        <source src="https://github.com/user-attachments/assets/aa972124-6cac-4f6a-8039-8d42fabe6984" type="video/mp4">
    
    </video>

    <header>
        <nav>ВЕДЬМАК 3: ДИКАЯ ОХОТА</nav>
    </header>

    <main>
        <section class="content-box">
            <h1>Добро пожаловать в Каэр Морхен</h1>
            <p>Привет! Меня зовут <span class="name-highlight">Камилла</span>.</p>
            <p>Это мой адаптивный сайт. Тут я объединила эстетику Ведьмака и всё, чему научилась на уроках: от семантики до CSS-анимаций.</p>
        </section>
    </main>

</body>
</html>
